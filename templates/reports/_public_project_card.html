<article class="card card-hover relative flex flex-col p-6">
    <div class="flex flex-wrap items-center gap-2 text-xs">
        <span class="badge badge-ember">{{ project.project_type }}</span>
        <span class="muted">{{ project.event_date|date:"M Y" }}</span>
    </div>
    <h3 class="mt-3 text-lg font-semibold leading-snug">
        <a href="{% url 'public_project_detail' project.id %}" class="after:absolute after:inset-0">{{ project.title }}</a>
    </h3>
    <p class="mt-2 line-clamp-3 text-sm muted">{{ project.impact_summary }}</p>
    <dl class="mt-auto grid grid-cols-2 gap-3 border-t border-line pt-4 text-sm">
        <div><dt class="text-xs muted">People reached</dt><dd class="font-semibold text-ink-900">{{ project.beneficiaries_count }}</dd></div>
        <div><dt class="text-xs muted">Volunteer hours</dt><dd class="font-semibold text-ink-900">{{ project.volunteer_hours }}</dd></div>
    </dl>
    {% if show_branch %}<p class="mt-3 text-xs muted"><i data-lucide="map-pin" class="inline size-3 text-ember-500"></i> {{ project.branch.name }}</p>{% endif %}
</article>
