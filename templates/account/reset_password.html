{% extends 'account/auth_base.html' %}
{% block auth_body %}
<span class="grid size-12 place-items-center rounded-2xl bg-ember-50 text-ember-600"><i data-lucide="lock-keyhole" class="size-6"></i></span>
<h1 class="display-lg mt-6">Choose a new password</h1>
<p class="mt-2 text-sm muted">Use at least 8 characters that you don't use on other sites.</p>
<form action="{% url 'reset_password' uidb64=uid token=token %}" method="post" class="mt-8 space-y-5">
    {% csrf_token %}
    <div>
        <label for="password" class="label">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" class="input">
    </div>
    <div>
        <label for="confirmPassword" class="label">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required class="input">
    </div>
    <button type="submit" class="btn btn-dark btn-lg w-full">Reset password</button>
</form>
{% endblock %}
