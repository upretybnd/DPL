{% extends 'account/auth_base.html' %}
{% block auth_body %}
<p class="eyebrow">Welcome back</p>
<h1 class="display-lg mt-4">Log in to DPL</h1>
<p class="mt-2 text-sm muted">New here? <a href="{% url 'sign_up' %}" class="font-semibold text-ember-600 hover:text-ember-700">Create a free account</a></p>

<form action="{% url 'login' %}" method="post" class="mt-8 space-y-5">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    <div>
        <label for="email" class="label">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required autofocus class="input" placeholder="you@example.com">
    </div>
    <div x-data="{ show: false }">
        <div class="flex items-center justify-between">
            <label for="password" class="label">Password</label>
            <a href="{% url 'forgot_password' %}" class="mb-1.5 text-xs font-semibold text-ember-600 hover:text-ember-700">Forgot password?</a>
        </div>
        <div class="relative">
            <input :type="show ? 'text' : 'password'" type="password" id="password" name="password" autocomplete="current-password" required class="input pr-12">
            <button type="button" @click="show = !show" class="absolute right-3 top-1/2 -translate-y-1/2 rounded-full p-1.5 text-ink-900/50 hover:text-ink-900" :aria-label="show ? 'Hide password' : 'Show password'">
                <i data-lucide="eye" class="size-4" x-show="!show"></i><i data-lucide="eye-off" class="size-4" x-show="show" x-cloak></i>
            </button>
        </div>
    </div>
    <button type="submit" class="btn btn-dark btn-lg w-full">Log in</button>
</form>
{% endblock %}
