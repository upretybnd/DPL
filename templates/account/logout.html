{% extends 'account/auth_base.html' %}
{% block auth_body %}
<span class="grid size-12 place-items-center rounded-2xl bg-emerald-50 text-emerald-700"><i data-lucide="log-out" class="size-6"></i></span>
<h1 class="display-lg mt-6">You're logged out</h1>
<p class="mt-2 muted">Thanks for visiting. See you at the library soon!</p>
<div class="mt-8 flex flex-wrap gap-3">
    <a href="{% url 'login' %}" class="btn btn-dark">Log in again</a>
    <a href="{% url 'home' %}" class="btn btn-outline">Back to home</a>
</div>
{% endblock %}
