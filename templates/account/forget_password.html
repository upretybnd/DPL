{% extends 'account/auth_base.html' %}
{% block auth_body %}
<span class="grid size-12 place-items-center rounded-2xl bg-ember-50 text-ember-600"><i data-lucide="key-round" class="size-6"></i></span>
<h1 class="display-lg mt-6">Forgot your password?</h1>
<p class="mt-2 text-sm muted">Enter the email you signed up with and we'll send you a link to choose a new password.</p>
<form action="{% url 'forgot_password' %}" method="post" class="mt-8 space-y-5">
    {% csrf_token %}
    <div>
        <label for="email" class="label">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required autofocus class="input" placeholder="you@example.com">
    </div>
    <button type="submit" class="btn btn-dark btn-lg w-full">Send reset link</button>
    <a href="{% url 'login' %}" class="btn btn-ghost w-full"><i data-lucide="arrow-left" class="size-4"></i> Back to log in</a>
</form>
{% endblock %}
