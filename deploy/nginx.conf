# Nginx site for dpl.org.np, sitting behind Cloudflare (SSL mode: Full (strict)).
# Certificate: Cloudflare Origin Certificate saved to /etc/ssl/cloudflare/ (see DEPLOY.md step 4).

upstream dpl_app {
    server unix:/srv/dpl/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.__DOMAIN__;
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    client_max_body_size 12M;   # matches the app's upload limits
    access_log /srv/dpl/logs/nginx-access.log;
    error_log  /srv/dpl/logs/nginx-error.log;

    # Uploads live on Cloudflare R2; nothing under /media is served from this server.
    location /media/ { return 404; }

    location / {
        proxy_pass http://dpl_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
